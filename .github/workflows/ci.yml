name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: check (${{ matrix.coverage }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        # Current releases catch new regressions; minimums enforce engines.node.
        node: ['22', '24', '26']
        coverage: [current]
        include:
          - node: '22.16.0'
            coverage: minimum
          - node: '24.0.0'
            coverage: minimum
          - node: '26.0.0'
            coverage: minimum
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: relate
          POSTGRES_PASSWORD: relate
          POSTGRES_DB: relate_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U relate -d relate_test" --health-interval
          5s --health-timeout 5s --health-retries 10
    env:
      RELATE_TEST_DATABASE_URL: postgresql://relate:relate@localhost:5432/relate_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:onboarding
      - if: matrix.node == '26'
        run: |
          pnpm check:development
          pnpm format:check
          pnpm lint
          pnpm test:release
          pnpm check:boundaries
          pnpm docs:check
      - run: |
          pnpm typecheck
          pnpm exec vitest run
          pnpm test:packaging
