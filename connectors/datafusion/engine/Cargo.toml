[package]
name = "relate-datafusion"
version = "0.0.0-dev.0"
edition = "2021"
publish = false
license = "Apache-2.0"
rust-version = "1.92"

[dependencies]
anyhow = "1"
async-trait = "0.1"
datafusion = { version = "=54.1.0", default-features = false, features = ["parquet", "sql", "datetime_expressions", "math_expressions", "string_expressions"] }
num-bigint = "0.4"
num-traits = "0.2"
object_store = { version = "=0.13.2", features = ["aws"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "macros"] }
url = "2"

[[bin]]
name = "relate-datafusion"
path = "src/main.rs"

[profile.dev]
debug = 0

[profile.test]
debug = 0
